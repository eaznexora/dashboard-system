<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agency Dashboard | EazDash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/globals.css?version=1.0.4">
  <link rel="stylesheet" href="css/sidebar.css?version=1.0.4">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="theme-blue">
  <!-- Master Shell Container -->
  <div id="app" class="app-container">
    <!-- Sidebar and Header will be injected here by initApp -->
    <!-- view-container will be created inside as well -->
  </div>
  
  <script src="js/store.js?version=1.0.2"></script>
  <script src="js/auth.js?version=1.0.3"></script>
  <script src="js/components.js?version=1.0.6"></script>
  <script src="js/admin.js?version=1.0.2"></script>
  <script src="js/views/assets.js?version=1.0.1"></script>
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // 1. Unified Auth Guard & Routing
      const user = requireAuth();
      if (!user) return window.location.replace('login.html');

      const urlParams = new URLSearchParams(window.location.search);
      const view = urlParams.get('view') || 'marketing';
      
      // 2. Initialize Core Shell (Injects Sidebar + Header + view-container)
      initApp(view, view.charAt(0).toUpperCase() + view.slice(1).replace('-', ' '));

      // 3. Fire Module-Specific Injections
      if (view === 'assets') {
          AssetHub.init();
      } else if (view === 'admin-panel') {
          AdminPanel.loadEmployees();
      } else if (view === 'projects') {
          AdminPanel.loadProjects();
      } else if (view === 'clients') {
          AdminPanel.loadClients();
      } else if (view === 'tasks') {
          AdminPanel.loadTasks();
      }
      // Add more routes as the SPA expands...
    });
  </script>
</body>
</html>
