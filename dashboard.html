<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | EazDash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/globals.css?version=1.0.4">
  <link rel="stylesheet" href="css/sidebar.css?version=1.0.4">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body class="theme-blue">
  <div id="app" class="app-container"></div>
  
  <script src="js/store.js?version=1.0.2"></script>
  <script src="js/auth.js?version=1.0.3"></script>
  <script src="js/components.js?version=1.0.5"></script>
  <script src="js/views/assets.js?version=1.0.0"></script>
  
  <script>
    // Unified SPA Shell logic
    const user = requireAuth();
    if (!user) window.location.replace('login.html');

    // Handle initial route or logic
    const urlParams = new URLSearchParams(window.location.search);
    const view = urlParams.get('view') || 'marketing';
    
    // Initialize standard shell
    initApp(view, view.charAt(0).toUpperCase() + view.slice(1));

    // View Routing
    if (view === 'assets') {
      AssetHub.init();
    }
    // More views can be added here...
  </script>
</body>
</html>
