<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | EazDash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/globals.css?version=1.0.3">
  <link rel="stylesheet" href="css/sidebar.css?version=1.0.4">
  <link rel="stylesheet" href="css/admin.css?version=1.0.1">
  <style>
    .profile-card {
      background: #fff;
      border-radius: 20px;
      padding: 2.5rem;
      box-shadow: var(--shadow-soft);
      border: 1px solid var(--border-color);
    }
    .profile-header {
      display: flex;
      align-items: center;
      gap: 2rem;
      margin-bottom: 3rem;
      padding-bottom: 2rem;
      border-bottom: 1px solid #f1f5f9;
    }
    .profile-avatar-wrapper {
      position: relative;
    }
    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 30px;
      object-fit: cover;
      border: 4px solid #fff;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }
    .avatar-edit-btn {
      position: absolute;
      bottom: -10px;
      right: -10px;
      width: 36px;
      height: 36px;
      background: var(--accent-color);
      color: #fff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: 3px solid #fff;
      transition: transform 0.2s;
    }
    .avatar-edit-btn:hover { transform: scale(1.1); }
    
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2rem;
    }
    @media (max-width: 900px) {
      .form-grid { grid-template-columns: 1fr; }
    }
    
    .section-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .section-title i { color: var(--accent-color); font-size: 1rem; }
  </style>
</head>
<body class="theme-blue">
  <div id="app" class="app-container"></div>
  
  <script src="js/store.js?version=1.0.2"></script>
  <script src="js/auth.js?version=1.0.3"></script>
  <script src="js/components.js?version=1.0.5"></script>
  <script src="js/profile.js?version=1.0.0"></script>
  
  <script>
    const user = requireAuth();
    if (!user) window.location.replace('login.html');
    
    initApp('profile', 'Settings & Profile');

    const content = `
      <div style="max-width: 1000px; margin: 0 auto;">
        <div class="profile-card">
          <div class="profile-header">
            <div class="profile-avatar-wrapper">
              <img src="${user.image || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) + '&background=ebf2ff&color=2563eb'}" id="user-avatar-preview" class="profile-avatar" alt="Profile">
              <label for="avatar-upload" class="avatar-edit-btn">
                <i class="ph-bold ph-pencil-simple"></i>
              </label>
              <input type="file" id="avatar-upload" hidden accept="image/*">
            </div>
            <div>
              <h1 style="font-size: 1.75rem; font-weight: 800; margin-bottom: 0.25rem;">${user.name}</h1>
              <p style="color: var(--text-secondary); font-size: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                <i class="ph ph-envelope"></i> ${user.email}
              </p>
              <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                <span class="status-badge" style="background:var(--accent-light); color:var(--accent-color); font-weight:700;">${user.role}</span>
                <span id="profile-dept-badge" class="status-badge" style="background:#f1f5f9; color:var(--text-secondary);">FETCHING...</span>
              </div>
            </div>
          </div>

          <form id="profile-form">
            <div class="form-grid">
              <!-- Basic Info -->
              <div>
                <h4 class="section-title"><i class="ph-bold ph-user"></i> Basic Information</h4>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                  <label>Full Name</label>
                  <input type="text" name="name" class="form-control" value="${user.name}" required>
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                  <label>Phone Number</label>
                  <input type="tel" name="phone" id="profile-phone" class="form-control" placeholder="+1 (555) 000-0000">
                </div>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                  <label>Location</label>
                  <input type="text" name="location" id="profile-location" class="form-control" placeholder="City, Country">
                </div>
              </div>

              <!-- Professional Details -->
              <div>
                <h4 class="section-title"><i class="ph-bold ph-briefcase"></i> Professional Bio</h4>
                <div class="form-group" style="margin-bottom: 1.5rem;">
                  <label>Short Biography</label>
                  <textarea name="bio" id="profile-bio" class="form-control" style="min-height: 140px;" placeholder="Tell us about yourself and your role at Eaz Social..."></textarea>
                </div>
              </div>
            </div>

            <div style="margin-top: 2rem; padding-top: 2.5rem; border-top: 1px solid #f1f5f9;">
              <h4 class="section-title"><i class="ph-bold ph-share-network"></i> Professional Links</h4>
              <div class="form-grid" style="grid-template-columns: 1fr 1fr 1fr;">
                <div class="form-group">
                  <label><i class="ph ph-linkedin-logo"></i> LinkedIn</label>
                  <input type="url" name="linkedin" id="profile-linkedin" class="form-control" placeholder="linkedin.com/in/...">
                </div>
                <div class="form-group">
                  <label><i class="ph ph-github-logo"></i> GitHub</label>
                  <input type="url" name="github" id="profile-github" class="form-control" placeholder="github.com/...">
                </div>
                <div class="form-group">
                  <label><i class="ph ph-twitter-logo"></i> Twitter</label>
                  <input type="url" name="twitter" id="profile-twitter" class="form-control" placeholder="twitter.com/...">
                </div>
              </div>
            </div>

            <div style="margin-top: 3rem; display: flex; justify-content: flex-end; gap: 1rem;">
              <button type="button" class="btn btn-secondary" onclick="window.location.reload()">Reset Changes</button>
              <button type="submit" class="btn btn-primary" style="padding: 1rem 3rem; font-weight: 700; border-radius: 14px;">
                <i class="ph ph-floppy-disk"></i> Save Profile Settings
              </button>
            </div>
          </form>
        </div>
      </div>
    `;
    document.getElementById('dashboard-content').innerHTML = content;

    // Load full profile details from server
    if (typeof ProfileManager !== 'undefined') {
      ProfileManager.loadProfile();
    }
  </script>
</body>
</html>
