<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Workspace | Eazly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/globals.css?version=1.0.3">
  <link rel="stylesheet" href="css/sidebar.css?version=1.0.3">
  <link rel="stylesheet" href="css/admin.css?version=1.0.1">
  <link rel="stylesheet" href="css/employee.css?version=1.0.1">
<link rel="icon" type="image/png" href="assets/N.png">
</head>
<body class="theme-blue">
  <div id="app" class="app-container"></div>
  
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/store.js?version=1.0.2"></script>
  <script src="js/auth.js?version=1.0.3"></script>
  <script src="js/components.js?version=1.0.4"></script>
  <script src="js/employee.js?version=1.0.1"></script>
  <script src="js/sync.js?version=1.0.0"></script>
  
  <script>
    const user = requireAuth();
    if (!user) window.location.replace('login.html');
    
    initApp('employee', 'My Workspace');

    const content = `
      <div class="workspace-layout">
        <div>
          <!-- Time Tracking Card -->
          <div class="card" style="margin-bottom:2rem; background:linear-gradient(135deg, #2563eb, #1e40af); color:#fff; border:none;">
            <div style="display:flex; justify-content:space-between; align-items:center;">
              <div>
                <div id="clock-status" style="font-size:0.75rem; letter-spacing:1px; margin-bottom:0.5rem;">CHECKING STATUS...</div>
                <div id="timer" style="font-size:2.2rem; font-weight:800; font-variant-numeric:tabular-nums;">00:00:00</div>
                <div style="display:flex; align-items:center; gap:0.75rem; margin-top:0.25rem;">
                   <div style="font-size:0.875rem; opacity:0.8;">Current Work Session</div>
                   <div id="today-hrs-total" style="font-size:0.7rem; font-weight:800; background:rgba(255,255,255,0.15); padding:0.15rem 0.5rem; border-radius:4px; letter-spacing:0.5px; text-transform:uppercase;">Today: 0.00 hrs</div>
                </div>
              </div>
              <div style="display:flex; flex-direction:column; gap:0.5rem;">
                <button class="btn btn-primary" id="btn-clock-in" onclick="EmployeePortal.clockIn()" style="padding:1rem 2rem; font-size:1.1rem; width:100%; justify-content:center; border-radius:12px;">Clock In</button>
                <button class="btn btn-danger" id="btn-clock-out" onclick="EmployeePortal.clockOut()" style="padding:1rem 2rem; font-size:1.1rem; width:100%; justify-content:center; border-radius:12px; display:none;">Clock Out</button>
                <button class="btn" id="btn-pause" onclick="EmployeePortal.pauseWork()" style="padding:0.75rem 1.5rem; font-size:0.9rem; width:100%; justify-content:center; border-radius:12px; display:none; background:rgba(255,255,255,0.2); color:#fff; border:1px solid rgba(255,255,255,0.3); cursor:pointer;"><i class="ph ph-coffee"></i> Take Break</button>
                <button class="btn" id="btn-resume" onclick="EmployeePortal.resumeWork()" style="padding:0.75rem 1.5rem; font-size:0.9rem; width:100%; justify-content:center; border-radius:12px; display:none; background:#10b981; color:#fff; border:none; cursor:pointer; animation: pulse 1.5s infinite;"><i class="ph ph-play"></i> Resume Work</button>
              </div>
            </div>
          </div>

          <!-- Kanban Board -->
          <h3 style="font-weight:800; margin-bottom:1.5rem; font-size:1.25rem;">My Board</h3>
          <div id="kanban-board"></div>
        </div>

        <div style="display:grid; gap:2rem; align-content:start;">
          <div class="card">
            <h4 style="font-weight:700; margin-bottom:1.25rem; font-size:0.875rem;">Recent Activity</h4>
            <div id="history-list"></div>
          </div>
          <div class="card" style="background:#f8fafc; border:1px dashed var(--border-color);">
             <h4 style="font-weight:700; margin-bottom:0.5rem; font-size:0.875rem;">Need Help?</h4>
             <p style="font-size:0.75rem; color:var(--text-secondary); line-height:1.4;">Contact your project lead or check the documentation for guidance on complex tasks.</p>
          </div>
        </div>
      </div>
    `;
    document.getElementById('dashboard-content').innerHTML = content;

    EmployeePortal.init(user);
  </script>
</body>
</html>
