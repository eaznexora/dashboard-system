<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Dashboard | EazDash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .pipeline-stage {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 0.5rem;
      background: var(--card-bg);
      position: relative;
    }
    .pipeline-stage::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: var(--accent-light);
      border-top-left-radius: var(--radius-md);
      border-bottom-left-radius: var(--radius-md);
    }
    .pipeline-stage.stage-1::before { background: #cbd5e1; }
    .pipeline-stage.stage-2::before { background: #93c5fd; }
    .pipeline-stage.stage-3::before { background: #fcd34d; }
    .pipeline-stage.stage-4::before { background: #f97316; }
    .pipeline-stage.stage-5::before { background: #10b981; }
  </style>
</head>
<body class="theme-beige">
  <div id="app" class="app-container"></div>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initApp('sales', 'Sales');

    const content = `
      <div class="grid-cols-4">
        <div class="card metric-card">
          <div class="metric-title">Daily Sales <div class="metric-icon"><i class="ph ph-handshake"></i></div></div>
          <div class="metric-value editable">14</div>
          <div class="metric-change positive"><i class="ph ph-trend-up"></i> <span class="editable">+2</span> vs yesterday</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Daily Revenue <div class="metric-icon"><i class="ph ph-coins"></i></div></div>
          <div class="metric-value editable">$4,250</div>
          <div class="metric-change positive"><i class="ph ph-trend-up"></i> <span class="editable">+$400</span> vs yesterday</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Win Rate <div class="metric-icon"><i class="ph ph-trophy"></i></div></div>
          <div class="metric-value editable">32.4%</div>
          <div class="metric-change positive"><i class="ph ph-trend-up"></i> <span class="editable">+4.1%</span> vs last month</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Avg Deal Size <div class="metric-icon"><i class="ph ph-briefcase"></i></div></div>
          <div class="metric-value editable">$3,100</div>
          <div class="metric-change negative"><i class="ph ph-trend-down"></i> <span class="editable">-$150</span> vs last month</div>
        </div>
      </div>

      <div class="grid-cols-2">
        <div class="card chart-card">
          <h3 style="font-weight:600; margin-bottom:1rem;">Sales Timeline & Target</h3>
          <canvas id="salesLineChart"></canvas>
        </div>
        
        <div class="card">
          <h3 style="font-weight:600; margin-bottom: 1rem;">Deal Pipeline Stages</h3>
          <p style="color:var(--text-secondary); font-size:0.875rem; margin-bottom:1rem;">Flow from Contacted to Closed/Won</p>
          
          <div class="pipeline-stage stage-1">
             <div>
                <h4 style="font-weight:600;">1. Contacted / Lead</h4>
                <div style="font-size:0.75rem; color:var(--text-secondary);">458 deals</div>
             </div>
             <div style="font-weight:700;" class="editable">$145,000</div>
          </div>
          <div class="pipeline-stage stage-2">
             <div>
                <h4 style="font-weight:600;">2. Qualified</h4>
                <div style="font-size:0.75rem; color:var(--text-secondary);">214 deals</div>
             </div>
             <div style="font-weight:700;" class="editable">$95,000</div>
          </div>
          <div class="pipeline-stage stage-3">
             <div>
                <h4 style="font-weight:600;">3. Proposal Submitted</h4>
                <div style="font-size:0.75rem; color:var(--text-secondary);">112 deals</div>
             </div>
             <div style="font-weight:700;" class="editable">$54,000</div>
          </div>
          <div class="pipeline-stage stage-4">
             <div>
                <h4 style="font-weight:600;">4. Negotiation</h4>
                <div style="font-size:0.75rem; color:var(--text-secondary);">48 deals</div>
             </div>
             <div style="font-weight:700;" class="editable">$32,000</div>
          </div>
          <div class="pipeline-stage stage-5">
             <div>
                <h4 style="font-weight:600;">5. Closed / Won</h4>
                <div style="font-size:0.75rem; color:var(--text-secondary);">38 deals (This Month)</div>
             </div>
             <div style="font-weight:700; color:var(--success-color);" class="editable">$24,500</div>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom: 2rem;">
         <h3 style="font-weight:600; margin-bottom:1rem;">Product Performance Comparison</h3>
         <canvas id="productBarChart" style="height:300px; width:100%;"></canvas>
      </div>
    `;

    document.getElementById('dashboard-content').innerHTML = content;

    const lineCtx = document.getElementById('salesLineChart').getContext('2d');
    new Chart(lineCtx, {
      type: 'line',
      data: {
        labels: ['W1', 'W2', 'W3', 'W4', 'W5'],
        datasets: [{
          label: 'Actual Sales ($)',
          data: [12000, 18000, 14000, 26000, 31000],
          borderColor: '#d97706', // gold
          borderWidth: 3,
          tension: 0.1,
          pointRadius: 4
        }, {
          label: 'Target',
          data: [15000, 15000, 20000, 20000, 25000],
          borderColor: '#94a3b8',
          borderDash: [5, 5],
          borderWidth: 2,
          pointRadius: 0
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'top' } },
        scales: {
          x: { grid: { display:false } },
          y: { grid: { borderDash:[5,5] } }
        }
      }
    });

    const prodCtx = document.getElementById('productBarChart').getContext('2d');
    new Chart(prodCtx, {
      type: 'bar',
      data: {
        labels: ['Basic Plan', 'Pro Plan', 'Enterprise', 'Add-ons'],
        datasets: [{
          label: 'Q1 (Current)',
          data: [15000, 42000, 85000, 12000],
          backgroundColor: '#d97706'
        }, {
          label: 'Q4 (Previous)',
          data: [12000, 38000, 65000, 10000],
          backgroundColor: '#fde68a'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'top' } },
        scales: {
          x: { grid: { display:false } },
          y: { grid: { borderDash:[5,5] } }
        }
      }
    });

  </script>
</body>
</html>
