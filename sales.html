<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Dashboard | Tech Agency UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="theme-beige">
  <div id="app" class="app-container"></div>
  
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initApp('sales', 'Sales & Projects');
    const store = window.EazStore.get().sales;

    const content = `
      <div class="grid-cols-4">
        <div class="card metric-card">
          <div class="metric-title">New Contracts <div class="metric-icon"><i class="ph ph-handshake"></i></div></div>
          <div class="metric-value">${store.contracts}</div>
          <div class="metric-change ${store.contractsPos?'positive':'negative'}"><i class="ph ${store.contractsPos?'ph-trend-up':'ph-trend-down'}"></i> <span>${store.contractsChange}</span> vs yesterday</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Daily Bookings <div class="metric-icon"><i class="ph ph-coins"></i></div></div>
          <div class="metric-value">${store.bookings}</div>
          <div class="metric-change ${store.bookingsPos?'positive':'negative'}"><i class="ph ${store.bookingsPos?'ph-trend-up':'ph-trend-down'}"></i> <span>${store.bookingsChange}</span> vs yesterday</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Proposal Win Rate <div class="metric-icon"><i class="ph ph-trophy"></i></div></div>
          <div class="metric-value">${store.winRate}</div>
          <div class="metric-change ${store.winRatePos?'positive':'negative'}"><i class="ph ${store.winRatePos?'ph-trend-up':'ph-trend-down'}"></i> <span>${store.winRateChange}</span> vs last month</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Avg Project Value <div class="metric-icon"><i class="ph ph-briefcase"></i></div></div>
          <div class="metric-value">${store.avgProj}</div>
          <div class="metric-change ${store.avgProjPos?'positive':'negative'}"><i class="ph ${store.avgProjPos?'ph-trend-up':'ph-trend-down'}"></i> <span>${store.avgProjChange}</span> vs last month</div>
        </div>
      </div>

      <div class="layout-2-1">
        <div class="card chart-card">
          <h3 style="font-weight:600; margin-bottom:1rem;">Project Sales Timeline</h3>
          <div class="chart-wrapper"><canvas id="salesLineChart"></canvas></div>
        </div>
      </div>

      <div class="card chart-card" style="margin-bottom: 2rem;">
         <h3 style="font-weight:600; margin-bottom:1rem;">Service Performance Comparison</h3>
         <div class="chart-wrapper"><canvas id="productBarChart"></canvas></div>
      </div>
    `;

    document.getElementById('dashboard-content').innerHTML = content;

    const lineCtx = document.getElementById('salesLineChart').getContext('2d');
    new Chart(lineCtx, {
      type: 'line',
      data: {
        labels: ['W1', 'W2', 'W3', 'W4', 'W5'],
        datasets: [{
          label: 'Actual Sales (₹)',
          data: store.salesLine,
          borderColor: '#2563eb',
          borderWidth: 3,
          tension: 0.1,
          pointRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'top' } },
        scales: {
          x: { grid: { display:false } },
          y: { grid: { borderDash:[5,5] }, ticks: { callback: function(val) { return '₹' + val/100000 + 'L'; } } }
        }
      }
    });

    const prodCtx = document.getElementById('productBarChart').getContext('2d');
    new Chart(prodCtx, {
      type: 'bar',
      data: {
        labels: ['E-Commerce Builds', 'Custom Web Apps', 'UI/UX Design', 'SEO / PPC'],
        datasets: [{
          label: 'Q1 (Current)',
          data: store.salesBar,
          backgroundColor: '#2563eb'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { position: 'top' } },
        scales: {
          x: { grid: { display:false } },
          y: { grid: { borderDash:[5,5] }, ticks: { callback: function(val) { return '₹' + val/100000 + 'L'; } } }
        }
      }
    });
  </script>
</body>
</html>
