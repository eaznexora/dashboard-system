<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marketing Dashboard | Tech Agency UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="theme-green">
  <div id="app" class="app-container"></div>
  
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initApp('marketing', 'Digital Marketing');
    const store = window.EazStore.get().marketing;

    const content = `
      <div class="grid-cols-4">
        <div class="card metric-card">
          <div class="metric-title">Website Visitors <div class="metric-icon"><i class="ph ph-users"></i></div></div>
          <div class="metric-value">${store.visitors}</div>
          <div class="metric-change ${store.visitorsPos?'positive':'negative'}"><i class="ph ${store.visitorsPos?'ph-trend-up':'ph-trend-down'}"></i> <span>${store.visitorsChange}</span> vs last month</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Leads Generated <div class="metric-icon"><i class="ph ph-user-plus"></i></div></div>
          <div class="metric-value">${store.leads}</div>
          <div class="metric-change ${store.leadsPos?'positive':'negative'}"><i class="ph ${store.leadsPos?'ph-trend-up':'ph-trend-down'}"></i> <span>${store.leadsChange}</span> vs last month</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Avg Lead Cost <div class="metric-icon"><i class="ph ph-cursor-click"></i></div></div>
          <div class="metric-value">${store.cost}</div>
          <div class="metric-change ${store.costPos?'positive':'negative'}"><i class="ph ${store.costPos?'ph-trend-down':'ph-trend-up'}"></i> <span>${store.costChange}</span> vs last month</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Marketing Spend <div class="metric-icon"><i class="ph ph-chart-line-up"></i></div></div>
          <div class="metric-value">${store.spend}</div>
          <div class="metric-change ${store.spendPos?'positive':'negative'}"><span>${store.spendChange}</span></div>
        </div>
      </div>

      <div class="layout-2-1">
        <div class="card chart-card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem;">
            <h3 style="font-weight:600;">Monthly Traffic vs Spend</h3>
            <select style="border:1px solid var(--border-color); border-radius:var(--radius-sm); padding:0.25rem; font-size:0.875rem;">
              <option>Last 7 Days</option>
              <option>Last 30 Days</option>
            </select>
          </div>
          <div class="chart-wrapper">
            <canvas id="marketingChart"></canvas>
          </div>
        </div>

        <div class="card">
          <h3 style="font-weight:600; margin-bottom: 1rem;">Top Landing Pages</h3>
          <ul class="list-group">
            <li class="list-item">
              <div class="list-item-left">
                <div class="list-item-icon"><i class="ph ph-browser"></i></div>
                <div>
                  <div class="list-item-title">/custom-web-apps</div>
                  <div class="list-item-subtitle">45,200 visitors</div>
                </div>
              </div>
              <div class="list-item-right" style="color:var(--success-color);">12.4% conv</div>
            </li>
            <li class="list-item">
              <div class="list-item-left">
                <div class="list-item-icon"><i class="ph ph-browser"></i></div>
                <div>
                  <div class="list-item-title">/seo-marketing</div>
                  <div class="list-item-subtitle">32,100 visitors</div>
                </div>
              </div>
              <div class="list-item-right" style="color:var(--success-color);">8.1% conv</div>
            </li>
            <li class="list-item">
              <div class="list-item-left">
                <div class="list-item-icon"><i class="ph ph-browser"></i></div>
                <div>
                  <div class="list-item-title">/contact-us</div>
                  <div class="list-item-subtitle">18,400 visitors</div>
                </div>
              </div>
              <div class="list-item-right" style="color:var(--success-color);">24.5% conv</div>
            </li>
          </ul>
        </div>
      </div>
    `;

    document.getElementById('dashboard-content').innerHTML = content;

    const ctx = document.getElementById('marketingChart').getContext('2d');
    let gradient = ctx.createLinearGradient(0, 0, 0, 400);
    gradient.addColorStop(0, 'rgba(37, 99, 235, 0.2)'); 
    gradient.addColorStop(1, 'rgba(37, 99, 235, 0)');

    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        datasets: [{
          label: 'Traffic',
          data: store.chart,
          borderColor: '#2563eb',
          borderWidth: 3,
          backgroundColor: gradient,
          fill: true,
          tension: 0.4,
          pointBackgroundColor: '#fff',
          pointBorderColor: '#2563eb',
          pointBorderWidth: 2,
          pointRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false }
        },
        scales: {
          y: { grid: { borderDash: [5, 5] } },
          x: { grid: { display: false } }
        }
      }
    });

  </script>
</body>
</html>
