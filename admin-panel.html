<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central Admin Panel | EazDash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/globals.css?version=1.0.2">
  <link rel="stylesheet" href="css/sidebar.css?version=1.0.2">
  <link rel="stylesheet" href="css/dashboard.css?version=1.0.2">
  <style>
    .admin-tabs { display:flex; gap:0.5rem; border-bottom:1px solid var(--border-color); margin-bottom:2rem; overflow-x:auto; padding-bottom:0.5rem; }
    .admin-tab { padding:0.75rem 1rem; cursor:pointer; font-weight:600; color:var(--text-secondary); border-bottom:3px solid transparent; white-space:nowrap; font-size:0.875rem; }
    .admin-tab.active { color:var(--accent-color); border-bottom-color:var(--accent-color); }
    .admin-section { display:none; }
    .admin-section.active { display:block; }
    .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-bottom:2rem; }
    .form-group { display:flex; flex-direction:column; gap:0.5rem; }
    .form-group label { font-size:0.875rem; font-weight:600; color:var(--text-primary); text-transform:capitalize; }
    .form-control { padding:0.75rem; border:1px solid var(--border-color); border-radius:var(--radius-sm); font-size:1rem; font-family:inherit; color:var(--text-primary); width:100%; box-sizing:border-box; }
    .form-control:focus { outline:none; border-color:var(--accent-color); }
    .save-btn { background:var(--success-color); color:#fff; padding:0.75rem 2rem; border:none; border-radius:var(--radius-md); font-weight:600; font-size:1rem; cursor:pointer; display:flex; align-items:center; gap:0.5rem; }
    .emp-card { display:flex; align-items:center; justify-content:space-between; padding:1rem; border:1px solid var(--border-color); border-radius:var(--radius-md); margin-bottom:0.75rem; flex-wrap:wrap; gap:0.75rem; }
    .emp-info { display:flex; align-items:center; gap:0.75rem; }
    .emp-avatar { width:40px; height:40px; background:var(--accent-color); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; }
    .active-dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
    .active-dot.online { background:#10b981; }
    .active-dot.offline { background:#94a3b8; }
    .task-form { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1.5rem; padding:1.5rem; border:1px solid var(--border-color); border-radius:var(--radius-md); }
    .task-row { display:flex; align-items:center; justify-content:space-between; padding:0.875rem; border:1px solid var(--border-color); border-radius:var(--radius-md); margin-bottom:0.5rem; flex-wrap:wrap; gap:0.5rem; }
    .del-btn { background:none; border:1px solid var(--danger-color); color:var(--danger-color); padding:0.35rem 0.75rem; border-radius:var(--radius-sm); cursor:pointer; font-size:0.8rem; font-weight:600; }
    @media (max-width: 768px) {
      .form-grid, .task-form { grid-template-columns:1fr; }
    }
  </style>
</head>
<body class="theme-blue">
  <div id="app" class="app-container"></div>
  
  <script src="js/store.js?version=1.0.2"></script>
  <script src="js/auth.js?version=1.0.3"></script>
  <script src="js/components.js?version=1.0.3"></script>
  
  <script>
    const currentUser = requireAuth();
    if (!currentUser || currentUser.role !== 'ADMIN') {
      window.location.replace('admin-login.html');
    }
    initApp('admin-panel', 'Central Admin Panel');

    const adminHtml = `
      <div class="card" style="margin-bottom:2rem;">
        <div class="admin-tabs" id="tabs">
          <div class="admin-tab active" data-tab="employees"><i class="ph ph-users"></i> Employees</div>
          <div class="admin-tab" data-tab="tasks"><i class="ph ph-kanban"></i> Tasks</div>
          <div class="admin-tab" data-tab="metrics"><i class="ph ph-chart-bar"></i> Dashboard Metrics</div>
        </div>
        
        <div id="tab-content"></div>
      </div>
    `;
    document.getElementById('dashboard-content').innerHTML = adminHtml;

    // --- TAB SWITCHING ---
    document.querySelectorAll('.admin-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        loadTab(tab.dataset.tab);
      });
    });

    function loadTab(tab) {
      if (tab === 'employees') loadEmployees();
      else if (tab === 'tasks') loadTasksAdmin();
      else if (tab === 'metrics') loadMetrics();
    }

    // ===================== EMPLOYEES TAB =====================
    async function loadEmployees() {
      const res = await fetch('/api/employees');
      const emps = await res.json();
      const container = document.getElementById('tab-content');

      const activeCount = emps.filter(e => e.isActive).length;

      container.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
          <div>
            <h3 style="font-weight:700;">All Employees (${emps.length})</h3>
            <p style="color:var(--text-secondary);font-size:0.875rem;">${activeCount} currently active</p>
          </div>
        </div>
        <div id="emp-list">
          ${emps.length === 0 ? '<p style="color:var(--text-secondary);text-align:center;padding:2rem;">No employees registered yet.</p>' : 
            emps.map(e => `
              <div class="emp-card">
                <div class="emp-info">
                  <div class="emp-avatar">${e.name ? e.name[0].toUpperCase() : '?'}</div>
                  <div>
                    <div style="font-weight:600;color:var(--text-primary);">${e.name}</div>
                    <div style="font-size:0.8rem;color:var(--text-secondary);">${e.email}</div>
                  </div>
                </div>
                <div style="display:flex;align-items:center;gap:0.75rem;">
                  <span class="active-dot ${e.isActive ? 'online' : 'offline'}"></span>
                  <span style="font-size:0.8rem;font-weight:600;color:${e.isActive ? '#10b981' : 'var(--text-secondary)'};">${e.isActive ? 'Working' : 'Offline'}</span>
                </div>
              </div>
            `).join('')}
        </div>
      `;
    }

    // ===================== TASKS TAB =====================
    let allEmployees = [];

    async function loadTasksAdmin() {
      const [tasksRes, empsRes] = await Promise.all([
        fetch('/api/tasks?role=ADMIN'),
        fetch('/api/employees')
      ]);
      const tasks = await tasksRes.json();
      allEmployees = await empsRes.json();
      const container = document.getElementById('tab-content');

      container.innerHTML = `
        <h3 style="font-weight:700;margin-bottom:1rem;">Assign New Task</h3>
        <div class="task-form" id="task-form">
          <div class="form-group">
            <label>Title</label>
            <input type="text" id="tf-title" class="form-control" placeholder="Task title" required>
          </div>
          <div class="form-group">
            <label>Assign To</label>
            <select id="tf-assign" class="form-control">
              <option value="">-- Select Employee --</option>
              ${allEmployees.map(e => `<option value="${e._id}">${e.name} (${e.email})</option>`).join('')}
            </select>
          </div>
          <div class="form-group">
            <label>Project</label>
            <input type="text" id="tf-project" class="form-control" placeholder="Project name" value="General">
          </div>
          <div class="form-group">
            <label>Priority</label>
            <select id="tf-priority" class="form-control">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
              <option value="urgent">Urgent</option>
            </select>
          </div>
          <div class="form-group">
            <label>Deadline</label>
            <input type="date" id="tf-deadline" class="form-control">
          </div>
          <div class="form-group">
            <label>Est. Hours</label>
            <input type="number" id="tf-hours" class="form-control" placeholder="0" min="0">
          </div>
          <div class="form-group" style="grid-column:1/-1;">
            <label>Description</label>
            <textarea id="tf-desc" class="form-control" rows="2" placeholder="Task description..."></textarea>
          </div>
          <div style="grid-column:1/-1;">
            <button class="save-btn" onclick="createTask()"><i class="ph ph-plus"></i> Create Task</button>
          </div>
        </div>

        <h3 style="font-weight:700;margin-bottom:1rem;">All Tasks (${tasks.length})</h3>
        <div id="tasks-list">
          ${tasks.length === 0 ? '<p style="color:var(--text-secondary);text-align:center;padding:1rem;">No tasks created yet.</p>' :
            tasks.map(t => `
              <div class="task-row">
                <div>
                  <div style="font-weight:600;">${t.title}</div>
                  <div style="font-size:0.8rem;color:var(--text-secondary);">
                    ${t.assignedTo ? t.assignedTo.name : 'Unassigned'} · ${t.project} · ${t.priority}
                    ${t.deadline ? ' · Due ' + new Date(t.deadline).toLocaleDateString() : ''}
                  </div>
                </div>
                <div style="display:flex;align-items:center;gap:0.5rem;">
                  <span style="padding:0.25rem 0.75rem;border-radius:2rem;font-size:0.75rem;font-weight:600;
                    background:${t.status==='completed'?'#d1fae5':t.status==='in-progress'?'#dbeafe':'#fef3c7'};
                    color:${t.status==='completed'?'#065f46':t.status==='in-progress'?'#1e40af':'#92400e'};">
                    ${t.status}
                  </span>
                  <button class="del-btn" onclick="deleteTask('${t._id}')"><i class="ph ph-trash"></i></button>
                </div>
              </div>
            `).join('')}
        </div>
      `;
    }

    async function createTask() {
      const title = document.getElementById('tf-title').value.trim();
      if (!title) return alert('Title is required');
      
      const body = {
        title,
        description: document.getElementById('tf-desc').value.trim(),
        assignedTo: document.getElementById('tf-assign').value || undefined,
        project: document.getElementById('tf-project').value.trim() || 'General',
        priority: document.getElementById('tf-priority').value,
        deadline: document.getElementById('tf-deadline').value || undefined,
        estimatedHours: parseFloat(document.getElementById('tf-hours').value) || 0
      };

      const res = await fetch('/api/tasks', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify(body)
      });
      if (res.ok) loadTasksAdmin();
      else alert('Failed to create task');
    }

    async function deleteTask(id) {
      if (!confirm('Delete this task?')) return;
      await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
      loadTasksAdmin();
    }

    // ===================== METRICS TAB =====================
    async function loadMetrics() {
      const container = document.getElementById('tab-content');
      const categories = ['marketing','financial','operations','support','sales','executive'];

      container.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:1rem;">
          <h3 style="font-weight:700;">Dashboard Metrics</h3>
          <button class="save-btn" onclick="saveMetrics()"><i class="ph ph-floppy-disk"></i> Save All to MongoDB</button>
        </div>
        <div class="admin-tabs" id="metric-tabs" style="border-top:none;">
          ${categories.map((c, i) => `<div class="admin-tab ${i===0?'active':''}" data-metric="${c}">${c.charAt(0).toUpperCase()+c.slice(1)}</div>`).join('')}
        </div>
        <div id="metric-forms"></div>
      `;

      // Load first category
      await loadMetricCategory(categories[0]);

      document.querySelectorAll('#metric-tabs .admin-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('#metric-tabs .admin-tab').forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          loadMetricCategory(tab.dataset.metric);
        });
      });
    }

    let currentMetricData = {};

    async function loadMetricCategory(category) {
      const res = await fetch(`/api/dashboard/${category}`);
      const data = await res.json();
      currentMetricData[category] = data;

      const formContainer = document.getElementById('metric-forms');
      let html = '<div class="form-grid">';
      
      for (let prop in data) {
        const val = data[prop];
        if (typeof val === 'boolean') {
          html += `<div class="form-group"><label>${prop}</label>
            <select class="form-control" data-cat="${category}" data-prop="${prop}">
              <option value="true" ${val?'selected':''}>Positive</option>
              <option value="false" ${!val?'selected':''}>Negative</option>
            </select></div>`;
        } else if (Array.isArray(val)) {
          html += `<div class="form-group" style="grid-column:1/-1;"><label>${prop} (comma separated)</label>
            <input type="text" class="form-control" data-cat="${category}" data-prop="${prop}" value="${val.join(', ')}"></div>`;
        } else {
          html += `<div class="form-group"><label>${prop}</label>
            <input type="text" class="form-control" data-cat="${category}" data-prop="${prop}" value="${val}"></div>`;
        }
      }
      html += '</div>';
      formContainer.innerHTML = html;
    }

    async function saveMetrics() {
      // Collect all visible form data
      const inputs = document.querySelectorAll('#metric-forms .form-control');
      const catData = {};

      inputs.forEach(input => {
        const cat = input.dataset.cat;
        const prop = input.dataset.prop;
        if (!catData[cat]) catData[cat] = { ...currentMetricData[cat] };

        if (input.tagName === 'SELECT') {
          catData[cat][prop] = input.value === 'true';
        } else if (currentMetricData[cat][prop] && Array.isArray(currentMetricData[cat][prop])) {
          catData[cat][prop] = input.value.split(',').map(s => isNaN(s.trim()) ? s.trim() : Number(s.trim()));
        } else {
          catData[cat][prop] = input.value;
        }
      });

      for (const [category, metrics] of Object.entries(catData)) {
        await fetch(`/api/dashboard/${category}`, {
          method: 'PUT', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ metrics })
        });
      }
      alert('Metrics saved to MongoDB!');
    }

    // --- INIT ---
    loadEmployees();
  </script>
</body>
</html>
