<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Management | Eaz Dash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/globals.css?version=1.0.3">

<link rel="icon" type="image/x-icon" href="assets/favicon.ico">

<body class="theme-blue">

  <script src="js/store.js?version=1.0.2"></script>

  <script src="js/components.js?version=1.0.4"></script>
  <script src="js/admin.js?version=1.0.1"></script>
  
  <script>
    // Auth Guard
    const user = requireAuth();
    if (!user || user.role !== 'ADMIN') window.location.replace('admin-login.html');

    // Initialize UI Shell
    initApp('admin-panel', 'Employees');

    // Load Initial View
    AdminPanel.loadEmployees();
  </script>
