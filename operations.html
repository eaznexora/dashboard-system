<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operations Dashboard | Eazly Agency</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/globals.css?version=1.0.1">
  <link rel="stylesheet" href="css/sidebar.css?version=1.0.1">
  <link rel="stylesheet" href="css/dashboard.css?version=1.0.1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="icon" type="image/png" href="assets/N.png">
</head>
<body class="theme-blue">
  <div id="app" class="app-container"></div>
  
  <script src="js/store.js?version=1.0.1"></script>
  <script src="js/components.js?version=1.0.1"></script>
  <script src="js/auth.js?version=1.0.1"></script>
  <script>
    // Initialize standard shell
    initApp('operations', 'Agency Operations');

    (async () => {
      const store = await window.EazStore.getCategory('operations') || window.EazStore.get().operations;

      const content = `
        <div class="grid-cols-4">
          <div class="card metric-card">
            <div class="metric-title">Resource Utilization <div class="metric-icon"><i class="ph ph-users-three"></i></div></div>
            <div class="metric-value">${store.utilization}</div>
            <div class="metric-change ${store.utilizationPos?'positive':'negative'}"><i class="ph ${store.utilizationPos?'ph-trend-up':'ph-trend-down'}"></i> <span>${store.utilizationChange}</span> vs last week</div>
          </div>
          <div class="card metric-card">
            <div class="metric-title">Uptime & Delivery <div class="metric-icon"><i class="ph ph-clock-countdown"></i></div></div>
            <div class="metric-value">${store.deliveryVar}</div>
            <div class="metric-change ${store.deliveryVarPos?'positive':'negative'}"><i class="ph ${store.deliveryVarPos?'ph-check-circle':'ph-warning-circle'}"></i> <span>${store.deliveryVarChange}</span></div>
          </div>
          <div class="card metric-card">
            <div class="metric-title">Active Projects <div class="metric-icon"><i class="ph ph-kanban"></i></div></div>
            <div class="metric-value">${store.activeProjects}</div>
            <div class="metric-change ${store.activeProjectsPos?'positive':'negative'}"><i class="ph ${store.activeProjectsPos?'ph-trend-up':'ph-trend-down'}"></i> <span>${store.activeProjectsChange}</span></div>
          </div>
          <div class="card metric-card">
            <div class="metric-title">Developer Bench Time <div class="metric-icon"><i class="ph ph-coffee"></i></div></div>
            <div class="metric-value">${store.benchTime}</div>
            <div class="metric-change ${store.benchTimePos?'positive':'negative'}"><i class="ph ${store.benchTimePos?'ph-trend-down':'ph-trend-up'}"></i> <span>${store.benchTimeChange}</span> vs last week</div>
          </div>
        </div>

        <div class="layout-2-1">
          <div class="card chart-card">
            <h3 style="font-weight:600; margin-bottom:1rem;">Resource Workload Capacity (Hours)</h3>
            <div class="chart-wrapper"><canvas id="utilizationChart"></canvas></div>
          </div>

          <div class="card">
            <h3 style="font-weight:600; margin-bottom: 1rem;">Project Milestones</h3>
            <ul class="list-group">
              <li class="list-item">
                <div class="list-item-left">
                  <div class="list-item-icon" style="background:#dcfce7; color:#16a34a;"><i class="ph ph-check-circle"></i></div>
                  <div>
                    <div class="list-item-title">E-Commerce Build</div>
                    <div class="list-item-subtitle" style="color:var(--success-color);">Phase 1 Delivered</div>
                  </div>
                </div>
              </li>
              <li class="list-item">
                <div class="list-item-left">
                  <div class="list-item-icon" style="background:#fef08a; color:#ea580c;"><i class="ph ph-warning-circle"></i></div>
                  <div>
                    <div class="list-item-title">B2B Portal UI</div>
                    <div class="list-item-subtitle" style="color:#ea580c;">Behind schedule (4 hrs)</div>
                  </div>
                </div>
              </li>
              <li class="list-item">
                <div class="list-item-left">
                  <div class="list-item-icon" style="background:#e0f2fe; color:#0284c7;"><i class="ph ph-spinner"></i></div>
                  <div>
                    <div class="list-item-title">SEO Audit Campaign</div>
                    <div class="list-item-subtitle">In Progress (70%)</div>
                  </div>
                </div>
              </li>
            </ul>
          </div>
        </div>

        <div class="card chart-card" style="margin-bottom: 2rem;">
          <h3 style="font-weight:600; margin-bottom:1rem;">Project Delivery Variance (Estimated vs Actual)</h3>
          <div class="chart-wrapper"><canvas id="deliveryVarianceChart"></canvas></div>
        </div>
      `;

      document.getElementById('dashboard-content').innerHTML = content;

      // Resource Utilization (Design vs Dev Workload)
      const utilCtx = document.getElementById('utilizationChart').getContext('2d');
      new Chart(utilCtx, {
        type: 'line',
        data: {
          labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5', 'Week 6'],
          datasets: [{
            label: 'Web Developers',
            data: store.devWorkload,
            borderColor: '#2563eb',
            backgroundColor: 'rgba(37, 99, 235, 0.1)',
            fill: true,
            tension: 0.4,
            pointRadius: 3
          }, {
            label: 'UI Designers',
            data: store.designWorkload,
            borderColor: '#0ea5e9',
            borderDash: [5, 5],
            backgroundColor: 'transparent',
            fill: false,
            tension: 0.4,
            pointRadius: 3
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          interaction: { mode: 'index', intersect: false },
          scales: {
            x: { grid: { display:false } },
            y: { grid: { borderDash: [5,5] }, title: { display:true, text:'Billable Hours Logged' }, suggestedMin: 0 }
          }
        }
      });

      // Project Delivery Variance Grouped Bar Chart
      const varCtx = document.getElementById('deliveryVarianceChart').getContext('2d');
      new Chart(varCtx, {
        type: 'bar',
        data: {
          labels: ['E-Commerce Build', 'B2B Portal', 'App Redesign', 'SEO Audit'],
          datasets: [
            {
              label: 'Estimated Hours',
              data: store.estHours,
              backgroundColor: '#cbd5e1',
              borderRadius: 4
            },
            {
              label: 'Actual Logged Hours',
              data: store.actHours,
              backgroundColor: '#ef4444',
              borderRadius: 4
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'top' } },
          scales: {
            x: { grid: { display: false } },
            y: { grid: { borderDash: [5, 5] }, title: { display: true, text: 'Total Hours' } }
          }
        }
      });
    })();
  </script>
</body>
</html>
