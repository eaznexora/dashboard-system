<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operations Dashboard | Tech Agency UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/globals.css?version=1.0.1">
  <link rel="stylesheet" href="css/sidebar.css?version=1.0.1">
  <link rel="stylesheet" href="css/dashboard.css?version=1.0.1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="theme-blue">
  <div id="app" class="app-container"></div>
  
  <script src="js/store.js?version=1.0.1"></script>
  <script src="js/components.js?version=1.0.1"></script>
  <script src="js/auth.js?version=1.0.1"></script>
  <script>
    initApp('operations', 'Operations / DevOps');
    const store = window.EazStore.get().operations;

    const content = `
      <div class="grid-cols-4">
        <div class="card metric-card">
          <div class="metric-title">Deployment Success <div class="metric-icon"><i class="ph ph-check-circle"></i></div></div>
          <div class="metric-value">${store.success}</div>
          <div class="metric-change ${store.successPos?'positive':'negative'}"><i class="ph ${store.successPos?'ph-trend-up':'ph-trend-down'}"></i> <span>${store.successChange}</span> vs last week</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Build Failures <div class="metric-icon"><i class="ph ph-warning-circle"></i></div></div>
          <div class="metric-value">${store.failures}</div>
          <div class="metric-change ${store.failuresPos?'positive':'negative'}"><i class="ph ${store.failuresPos?'ph-trend-down':'ph-trend-up'}"></i> <span>${store.failuresChange}</span> vs last week</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Downtime Impact <div class="metric-icon"><i class="ph ph-warning"></i></div></div>
          <div class="metric-value">${store.downtime}</div>
          <div class="metric-change ${store.downtimePos?'positive':'negative'}">${store.downtimeChange}</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Server Load (Avg) <div class="metric-icon"><i class="ph ph-cpu"></i></div></div>
          <div class="metric-value">${store.load}</div>
          <div class="metric-change ${store.loadPos?'positive':'negative'}">${store.loadChange}</div>
        </div>
      </div>

      <div class="card chart-card" style="margin-bottom: 2rem;">
        <h3 style="font-weight:600; margin-bottom:1rem;">Client Servers Load & Resource Usage</h3>
        <div class="chart-wrapper"><canvas id="sysLoadChart"></canvas></div>
      </div>
    `;

    document.getElementById('dashboard-content').innerHTML = content;

    const sysCtx = document.getElementById('sysLoadChart').getContext('2d');
    new Chart(sysCtx, {
      type: 'line',
      data: {
        labels: ['00:00', '04:00', '08:00', '12:00', '16:00', '20:00', '24:00'],
        datasets: [{
          label: 'CPU Load (%)',
          data: store.cpuChart,
          borderColor: '#2563eb',
          backgroundColor: 'rgba(37, 99, 235, 0.1)',
          fill: true,
          tension: 0.4
        }, {
          label: 'Memory Usage (%)',
          data: store.memChart,
          borderColor: '#64748b',
          borderDash: [5, 5],
          fill: false,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { grid: { display:false } },
          y: { min: 0, max: 100, grid: { borderDash: [5,5] } }
        }
      }
    });
  </script>
</body>
</html>
