<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Financial Dashboard | Tech Agency UI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="theme-warm">
  <div id="app" class="app-container"></div>
  
  <script src="js/store.js"></script>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initApp('financial', 'Financial');
    const store = window.EazStore.get().financial;

    const content = `
      <div class="grid-cols-4">
        <div class="card metric-card">
          <div class="metric-title">Monthly Revenue <div class="metric-icon"><i class="ph ph-currency-inr"></i></div></div>
          <div class="metric-value">${store.revenue}</div>
          <div class="metric-change ${store.revenuePos?'positive':'negative'}"><i class="ph ${store.revenuePos?'ph-trend-up':'ph-trend-down'}"></i> <span>${store.revenueChange}</span> vs last month</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Invoices Paid <div class="metric-icon"><i class="ph ph-receipt"></i></div></div>
          <div class="metric-value">${store.invoices}</div>
          <div class="metric-change ${store.invoicesPos?'positive':'negative'}"><i class="ph ${store.invoicesPos?'ph-trend-up':'ph-trend-down'}"></i> <span>${store.invoicesChange}</span> vs last month</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Profit Margin <div class="metric-icon"><i class="ph ph-chart-line-up"></i></div></div>
          <div class="metric-value">${store.margin}</div>
          <div class="metric-change ${store.marginPos?'positive':'negative'}"><i class="ph ${store.marginPos?'ph-trend-up':'ph-trend-down'}"></i> <span>${store.marginChange}</span> vs last month</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Cash Flow <div class="metric-icon"><i class="ph ph-bank"></i></div></div>
          <div class="metric-value">${store.cashflow}</div>
          <div class="metric-change ${store.cashflowPos?'positive':'negative'}"><i class="ph ${store.cashflowPos?'ph-trend-up':'ph-trend-down'}"></i> <span>${store.cashflowChange}</span> vs last month</div>
        </div>
      </div>

      <div class="grid-cols-2">
        <div class="card chart-card">
          <h3 style="font-weight:600; margin-bottom:1rem;">Monthly Revenue (₹)</h3>
          <div class="chart-wrapper"><canvas id="revenueBarChart"></canvas></div>
        </div>
        <div class="card chart-card">
          <h3 style="font-weight:600; margin-bottom:1rem;">Agency Expense Breakdown</h3>
          <div class="chart-wrapper"><canvas id="expenseDoughnutChart"></canvas></div>
        </div>
      </div>
      
      <div class="grid-cols-2">
        <div class="card">
          <h3 style="font-weight:600; margin-bottom: 1rem;">Recent Invoices</h3>
          <ul class="list-group">
            <li class="list-item">
              <div class="list-item-left">
                <div class="list-item-icon"><i class="ph ph-receipt"></i></div>
                <div><div class="list-item-title">INV-2023-091</div><div class="list-item-subtitle">Custom E-Commerce Build</div></div>
              </div>
              <div class="list-item-right" style="color:var(--success-color);">+₹2,50,000</div>
            </li>
            <li class="list-item">
              <div class="list-item-left">
                <div class="list-item-icon"><i class="ph ph-receipt"></i></div>
                <div><div class="list-item-title">INV-2023-092</div><div class="list-item-subtitle">SEO Retainer (Monthly)</div></div>
              </div>
              <div class="list-item-right" style="color:var(--success-color);">+₹35,000</div>
            </li>
          </ul>
        </div>
      </div>
    `;

    document.getElementById('dashboard-content').innerHTML = content;

    const barCtx = document.getElementById('revenueBarChart').getContext('2d');
    new Chart(barCtx, {
      type: 'bar',
      data: {
        labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
        datasets: [{
          label: 'Revenue',
          data: store.revenueChart,
          backgroundColor: '#2563eb',
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display: false } },
          y: { grid: { borderDash: [5, 5] }, ticks: { callback: function(val) { return '₹' + val/1000 + 'k'; } } }
        }
      }
    });

    const doughCtx = document.getElementById('expenseDoughnutChart').getContext('2d');
    new Chart(doughCtx, {
      type: 'doughnut',
      data: {
        labels: ['Payroll (Devs)', 'Marketing', 'Server Infra', 'Office & Misc'],
        datasets: [{
          data: store.expenseChart,
          backgroundColor: ['#2563eb', '#0ea5e9', '#8b5cf6', '#cbd5e1'],
          borderWidth: 0,
          cutout: '70%'
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { position: 'right' }
        }
      }
    });
  </script>
</body>
</html>
