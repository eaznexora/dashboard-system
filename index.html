<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Eazly | Agency</title><link rel="icon" type="image/png" href="assets/N.png">
</head>
<body>
  <script>
    const token = document.cookie.split('; ').find(c => c.startsWith('eaz_token='));
    if (!token) {
      window.location.replace('login.html');
    } else {
      try {
        const payload = JSON.parse(atob(token.split('=')[1].split('.')[1]));
        window.location.replace(payload.role === 'ADMIN' ? 'marketing.html' : 'employee.html');
      } catch(e) {
        window.location.replace('login.html');
      }
    }
  </script>
</body>
</html>
