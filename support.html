<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Dashboard | EazDash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="css/globals.css">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    .kanban-board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.5rem;
      margin-top: 1.5rem;
    }
    .kanban-col {
      background: var(--bg-color);
      border-radius: var(--radius-lg);
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-height: 500px;
    }
    .kanban-col-header {
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--border-color);
    }
    .ticket-card {
      background: var(--card-bg);
      padding: 1rem;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .ticket-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .ticket-tag {
      background: var(--accent-light);
      color: var(--accent-color);
      padding: 0.15rem 0.5rem;
      border-radius: 1rem;
      font-weight: 600;
    }
    @media (max-width: 1024px) {
      .kanban-board { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body class="theme-purple">
  <div id="app" class="app-container"></div>
  <script src="js/components.js"></script>
  <script src="js/auth.js"></script>
  <script>
    initApp('support', 'Support');

    const content = `
      <div class="grid-cols-4">
        <div class="card metric-card">
          <div class="metric-title">Ave. Response Time <div class="metric-icon"><i class="ph ph-clock"></i></div></div>
          <div class="metric-value editable">1h 14m</div>
          <div class="metric-change positive"><i class="ph ph-trend-down"></i> <span class="editable">-10m</span> vs last week</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Resolution Rate <div class="metric-icon"><i class="ph ph-check-square"></i></div></div>
          <div class="metric-value editable">92.4%</div>
          <div class="metric-change positive"><i class="ph ph-trend-up"></i> <span class="editable">+2.1%</span> vs last week</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">Active Tickets <div class="metric-icon"><i class="ph ph-ticket"></i></div></div>
          <div class="metric-value editable">142</div>
          <div class="metric-change negative"><span class="editable">+12</span> new today</div>
        </div>
        <div class="card metric-card">
          <div class="metric-title">CSAT Score <div class="metric-icon"><i class="ph ph-star"></i></div></div>
          <div class="metric-value editable">4.8/5.0</div>
          <div class="metric-change positive">Based on 1.2k ratings</div>
        </div>
      </div>

      <div class="grid-cols-2">
        <div class="card chart-card">
          <h3 style="font-weight:600; margin-bottom:1rem;">Support Volume Trend</h3>
          <canvas id="supportVolumeChart"></canvas>
        </div>
        <div class="card">
          <h3 style="font-weight:600; margin-bottom: 1rem;">Recurring Issue Tags</h3>
          <div style="display:flex; flex-wrap:wrap; gap:0.75rem;">
             <span class="ticket-tag" style="font-size:1rem; padding:0.5rem 1rem;">Billing (142)</span>
             <span class="ticket-tag" style="font-size:1rem; padding:0.5rem 1rem;">Login Issue (89)</span>
             <span class="ticket-tag" style="font-size:1rem; padding:0.5rem 1rem; background:#fee2e2; color:#ef4444;">API Overload (64)</span>
             <span class="ticket-tag" style="font-size:1rem; padding:0.5rem 1rem;">Performance (21)</span>
             <span class="ticket-tag" style="font-size:1rem; padding:0.5rem 1rem;">Feature Request (18)</span>
             <span class="ticket-tag" style="font-size:1rem; padding:0.5rem 1rem;">Downgrade (5)</span>
          </div>
        </div>
      </div>

      <!-- Kanban Board -->
      <h3 style="font-weight:600; margin-top:2rem; font-size:1.25rem;">Live Ticket Queue</h3>
      <div class="kanban-board">
        <!-- Col 1 -->
        <div class="kanban-col">
          <div class="kanban-col-header" style="border-bottom-color: var(--accent-light);">
            NEW <span style="background:var(--accent-light); padding:0.25rem 0.6rem; border-radius:1rem; font-size:0.875rem;">12</span>
          </div>
          <div class="ticket-card">
            <h4 class="editable" style="font-size:0.875rem;">Cannot reset password</h4>
            <p class="editable" style="font-size:0.75rem; color:var(--text-secondary);">User reported not receiving the reset email after 3 attempts.</p>
            <div class="ticket-meta">
              <span class="ticket-tag">Login Issue</span>
              <span style="color:var(--danger-color); font-weight:600;">Due in 2h</span>
            </div>
          </div>
          <div class="ticket-card">
            <h4 class="editable" style="font-size:0.875rem;">Upgrade failing</h4>
            <p class="editable" style="font-size:0.75rem; color:var(--text-secondary);">Card keeps declining even though balance is fine.</p>
            <div class="ticket-meta">
              <span class="ticket-tag">Billing</span>
              <span style="color:var(--danger-color); font-weight:600;">Due in 4h</span>
            </div>
          </div>
        </div>

        <!-- Col 2 -->
        <div class="kanban-col">
          <div class="kanban-col-header" style="border-bottom-color: var(--warning-color);">
             IN PROGRESS <span style="background:#fffbeb; color:var(--warning-color); padding:0.25rem 0.6rem; border-radius:1rem; font-size:0.875rem;">4</span>
          </div>
          <div class="ticket-card">
            <h4 class="editable" style="font-size:0.875rem;">Data Export Timeout</h4>
            <p class="editable" style="font-size:0.75rem; color:var(--text-secondary);">Exporting 10k records throws a 504 gateway timeout.</p>
            <div class="ticket-meta">
              <span class="ticket-tag">Performance</span>
              <span style="color:var(--warning-color); font-weight:600;">SLA OK</span>
            </div>
          </div>
        </div>

        <!-- Col 3 -->
        <div class="kanban-col">
          <div class="kanban-col-header" style="border-bottom-color: var(--success-color);">
             RESOLVED <span style="background:#ecfdf5; color:var(--success-color); padding:0.25rem 0.6rem; border-radius:1rem; font-size:0.875rem;">89</span>
          </div>
          <div class="ticket-card">
            <h4 class="editable" style="font-size:0.875rem; text-decoration:line-through; color:var(--text-secondary);">API Rate limit increased</h4>
            <p class="editable" style="font-size:0.75rem; color:var(--text-secondary);">Bumped enterprise customer to 1000 req/min.</p>
            <div class="ticket-meta">
              <span class="ticket-tag" style="background:#f1f5f9; color:var(--text-secondary);">API Overload</span>
              <span style="color:var(--success-color); font-weight:600;">Closed</span>
            </div>
          </div>
        </div>
      </div>
    `;

    document.getElementById('dashboard-content').innerHTML = content;

    const volCtx = document.getElementById('supportVolumeChart').getContext('2d');
    new Chart(volCtx, {
      type: 'area', // requires filler plugin which is on by default in full build, but we can fake it with line+fill
      data: {
        labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'],
        datasets: [{
          label: 'Tickets Received',
          data: [120, 190, 150, 220, 180, 80, 60],
          borderColor: '#8b5cf6',
          backgroundColor: 'rgba(139, 92, 246, 0.2)',
          fill: true,
          tension: 0.4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { grid: { display:false } },
          y: { grid: { borderDash: [5,5] } }
        }
      }
    });
  </script>
</body>
</html>
